
name: 매일 예보 저장
 
on:
  schedule:
    - cron: "0 21 * * *"   # 매일 한국시간 오전 6시 (GitHub 사정으로 조금 늦을 수 있음)
  workflow_dispatch:        # Actions 화면에서 수동으로 실행하는 버튼
 
permissions:
  contents: write           # 저장한 파일을 저장소에 올릴 수 있는 권한
 
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4
 
      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: 예보 받아서 저장
        run: python collector/save_forecast.py
 
      - name: 저장한 파일 올리기
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "새로 저장된 파일 없음"
          else
            git commit -m "예보 저장 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
 
